<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Option D: Gavel + strike block — direct, recognizable at 16px -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- handle (diagonal) -->
  <line x1="22" y1="10" x2="10" y2="22" stroke="#a16207" stroke-width="2.5" stroke-linecap="round"/>
  <!-- gavel head -->
  <g transform="rotate(-45 22 10)">
    <rect x="17" y="6" width="10" height="6" rx="1.2" fill="#a16207"/>
  </g>
  <!-- strike block -->
  <rect x="5" y="25" width="14" height="2.5" rx="1" fill="#a16207"/>
</svg>
